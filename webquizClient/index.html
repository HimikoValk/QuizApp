<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <title>Quiz Duell!</title>
</head>
<body>
  <h1>Server Connection</h1>
  <div>
    <label for="username">Username:</label>
    <input type="text" id="username" name="username" placeholder="Username">
  </div>
  <div>
    <label for="server_ip">Server-IP: </label>
    <input type="text" id="server_ip" name="host" placeholder="127.0.0.1">
    <label for="port">Servet-Port: </label>
    <input type="number" id="port" name="port" placeholder="90">
    <button id="connect_button">Connect</button>
    <button id="disconnect_button">Disconnect</button>
  </div>
</body>
<script type="module" src="scripts/network.js"></script>
<script type="module" src="scripts/index.js"></script>
</html>
