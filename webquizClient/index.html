<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <title>Quiz Duell!</title>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="quiz-icon">🧠</div>
      <h1>Quiz Duell</h1>
      <p>Verbinde dich mit dem Server und starte das Quiz!</p>
    </div>

    <form id="connection-form">
      <div class="form-group">
        <label for="username">🎮 Benutzername</label>
        <input type="text" id="username" name="username" placeholder="Gib deinen Namen ein..." required>
      </div>

      <div class="form-group">
        <label>🌐 Server-Verbindung</label>
        <div class="server-inputs">
          <div>
            <input type="text" id="server_ip" name="host" placeholder="127.0.0.1" value="127.0.0.1" required>
          </div>
          <div>
            <input type="number" id="port" name="port" placeholder="90" value="90" required>
          </div>
        </div>
      </div>

      <div class="button-group">
        <button type="button" id="connect_button" class="btn btn-primary">
          🚀 Verbinden
        </button>
        <button type="button" id="disconnect_button" class="btn btn-secondary">
          ❌ Trennen
        </button>
      </div>
    </form>

    <div id="status" class="status-indicator">
      <span id="status-text">Nicht verbunden</span>
    </div>
  </div>
  
</body>
<script type="module" src="scripts/network.js"></script>
<script type="module" src="scripts/index.js"></script>
</html>
